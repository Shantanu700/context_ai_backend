
x-app: &app
  image: context-ai-backend:prod
  build:
    context: ../..
    dockerfile: ./docker/prod/Dockerfile
  env_file:
    - path: ../../.env.prod
      required: true
  environment:
    REDIS_URL: redis://redis:6379/0
    DEBUG: "False"
  volumes:
    - media:/app/media
  depends_on:
    redis:
      condition: service_started
  restart: unless-stopped

services:
  web:
    <<: *app
    ports:
      - "${WEB_PORT:-8000}:8000"

  worker:
    <<: *app
    command: celery -A config worker -l info --concurrency=1
    ports: []
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 60s
      timeout: 10s
      retries: 3

  db:
    image: pgvector/pgvector:pg16
    profiles: ["localdb"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: context_ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
